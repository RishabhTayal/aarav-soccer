<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Aarav Soccer</title>
<style>
  :root {
    --blue: #2b6cff;
    --blue-dark: #1546b8;
    --orange: #ff7a1a;
    --orange-dark: #c45300;
    --grass: #2f9e4a;
    --ink: #12301a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a5c2a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 5;
    pointer-events: none;
    padding: max(8px, env(safe-area-inset-top)) 12px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px;
  }
  #scoreboard {
    pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    background: rgba(10, 40, 18, 0.72);
    color: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
    margin: 0 auto;
    flex-shrink: 1;
    white-space: nowrap;
  }
  @media (max-width: 420px) {
    .team-pill { font-size: 12px; }
    #score { font-size: 22px; min-width: 60px; }
    #scoreboard { gap: 6px; padding: 6px 10px; }
  }
  .team-pill {
    display: flex; align-items: center; gap: 6px;
    font-weight: 800; font-size: 14px; letter-spacing: 0.02em;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .dot.blue { background: var(--blue); }
  .dot.orange { background: var(--orange); }
  #score {
    font-size: 26px; font-weight: 900; letter-spacing: 0.04em;
    min-width: 72px; text-align: center;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  #score.pop { animation: scorepop 0.45s ease; }
  @keyframes scorepop {
    0% { transform: scale(1); }
    40% { transform: scale(1.45); color: #ffe56a; }
    100% { transform: scale(1); }
  }
  #muteBtn, #hint {
    pointer-events: auto;
  }
  #muteBtn {
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: rgba(10, 40, 18, 0.72); color: #fff;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    backdrop-filter: blur(8px);
  }
  #canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8, 28, 14, 0.55);
    backdrop-filter: blur(4px);
  }
  #overlay.hidden { display: none; }
  .card {
    text-align: center; color: #fff;
    background: linear-gradient(180deg, #2f8c44, #1f6a30);
    border: 4px solid #fff;
    border-radius: 28px;
    padding: 28px 28px 24px;
    width: min(420px, calc(100% - 32px));
    box-shadow: 0 16px 40px rgba(0,0,0,0.35), inset 0 2px 0 rgba(255,255,255,0.25);
  }
  .card h1 {
    font-size: clamp(28px, 7vw, 42px);
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
    margin-bottom: 6px;
  }
  .card p { font-size: 16px; opacity: 0.95; margin: 8px 0 18px; line-height: 1.35; }
  .play {
    appearance: none; border: 0; cursor: pointer;
    background: #ffe56a; color: #1a3d12;
    font-weight: 900; font-size: 22px;
    padding: 14px 36px; border-radius: 999px;
    box-shadow: 0 6px 0 #c9a61a, 0 10px 18px rgba(0,0,0,0.25);
    transform: translateY(0);
  }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a61a, 0 4px 10px rgba(0,0,0,0.2); }
  #toast {
    position: absolute; left: 50%; top: 20%;
    transform: translateX(-50%);
    z-index: 6;
    color: #ffe56a; font-weight: 900; font-size: clamp(26px, 7vw, 44px);
    text-shadow: 0 3px 0 #1a3d12, 0 6px 18px rgba(0,0,0,0.45);
    pointer-events: none; opacity: 0;
    letter-spacing: 0.03em;
  }
  #toast.show { animation: toastin 1.8s ease forwards; }
  @keyframes toastin {
    0% { opacity: 0; transform: translate(-50%, 12px) scale(0.85); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
    70% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -8px) scale(1); }
  }
  #hint {
    position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 6;
    background: rgba(10,40,18,0.8);
    color: #fff; font-weight: 800; font-size: 15px;
    padding: 10px 16px; border-radius: 999px;
    pointer-events: none;
    opacity: 0; transition: opacity 0.4s;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #flash {
    position: absolute; inset: 0; z-index: 4;
    pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center, rgba(255,229,106,0.65), rgba(255,255,255,0.15) 50%, transparent 70%);
  }
  #flash.go { animation: flash 0.7s ease; }
  @keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas"></canvas>
  <div id="flash"></div>
  <div id="hud">
    <div style="width:44px"></div>
    <div id="scoreboard">
      <div class="team-pill"><span class="dot blue"></span>AARAV</div>
      <div id="score">0 – 0</div>
      <div class="team-pill">CPU<span class="dot orange"></span></div>
    </div>
    <button id="muteBtn" aria-label="Mute">🔊</button>
  </div>
  <div id="toast"></div>
  <div id="hint">Flick to pass or shoot</div>
  <div id="overlay">
    <div class="card" id="card">
      <h1>⚽ Aarav Soccer</h1>
      <p>Flick the ball to pass or shoot.<br>Blue vs Orange · first to 5 wins!</p>
      <button class="play" id="playBtn">Play</button>
    </div>
  </div>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const card = document.getElementById("card");
  const playBtn = document.getElementById("playBtn");
  const scoreEl = document.getElementById("score");
  const muteBtn = document.getElementById("muteBtn");
  const toastEl = document.getElementById("toast");
  const hintEl = document.getElementById("hint");
  const flashEl = document.getElementById("flash");

  const FIELD_W = 110;
  const FIELD_H = 68;
  const GOAL_W = 3.2;
  const GOAL_H = 16;
  const BALL_R = 0.85;
  const PLAYER_R = 1.55;
  const WIN_SCORE = 5;

  const BLUE = 0;
  const ORANGE = 1;

  let dpr = 1;
  let view = { x: 0, y: 0, s: 1, pad: 10 };
  let lastT = 0;
  let shake = 0;
  let hintUntil = 0;
  let toastTimer = 0;

  const state = {
    mode: "menu", // menu | playing | celebrate | kickoff | over
    score: [0, 0],
    kickoffTeam: BLUE,
    celebrateT: 0,
    kickoffT: 0,
    lastTouch: BLUE,
    possession: null,
    trapLock: 0,
  };

  const ball = {
    x: FIELD_W / 2, y: FIELD_H / 2,
    vx: 0, vy: 0,
    r: BALL_R,
    owner: null,
    lastOwner: null,
  };

  const players = [];
  const particles = [];
  const trails = [];

  function makePlayer(id, team, num, name, role, x, y) {
    return {
      id, team, num, name, role,
      x, y, vx: 0, vy: 0,
      homeX: x, homeY: y,
      r: role === "gk" ? PLAYER_R * 1.08 : PLAYER_R,
      face: 1,
      kickCool: 0,
      stunned: 0,
    };
  }

  function formation() {
    players.length = 0;
    // Blue attacks right. Keeper left.
    players.push(makePlayer("b1", BLUE, 1, "Dev", "gk", 8, FIELD_H / 2));
    players.push(makePlayer("b7", BLUE, 7, "Leo", "mid", 38, FIELD_H * 0.32));
    players.push(makePlayer("b10", BLUE, 10, "Aarav", "fwd", 48, FIELD_H * 0.58));
    // Orange attacks left. Keeper right.
    players.push(makePlayer("o1", ORANGE, 1, "Max", "gk", FIELD_W - 8, FIELD_H / 2));
    players.push(makePlayer("o8", ORANGE, 8, "Rio", "mid", FIELD_W - 38, FIELD_H * 0.68));
    players.push(makePlayer("o9", ORANGE, 9, "Kai", "fwd", FIELD_W - 48, FIELD_H * 0.42));
  }

  // ---------- Audio ----------
  const audio = {
    ctx: null,
    muted: false,
    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    },
    tone(freq, dur, type, vol, slide) {
      if (this.muted || !this.ctx) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur);
    },
    noise(dur, vol) {
      if (this.muted || !this.ctx) return;
      const n = this.ctx.sampleRate * dur;
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource();
      const g = this.ctx.createGain();
      const f = this.ctx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = 900;
      s.buffer = buf; g.gain.value = vol || 0.08;
      s.connect(f); f.connect(g); g.connect(this.ctx.destination);
      s.start();
    },
    kick() { this.ensure(); this.noise(0.08, 0.1); this.tone(140, 0.12, "sine", 0.14, 70); },
    pass() { this.ensure(); this.tone(420, 0.08, "triangle", 0.08); },
    goal() {
      this.ensure();
      this.tone(392, 0.16, "square", 0.09);
      setTimeout(() => this.tone(523, 0.16, "square", 0.09), 120);
      setTimeout(() => this.tone(659, 0.28, "square", 0.1), 240);
    },
    whistle() { this.ensure(); this.tone(1400, 0.22, "sine", 0.07); setTimeout(() => this.tone(1200, 0.18, "sine", 0.06), 200); },
    tackle() { this.ensure(); this.noise(0.06, 0.12); this.tone(90, 0.1, "sawtooth", 0.06); },
    win() { this.ensure(); [523,659,784,1046].forEach((f,i) => setTimeout(() => this.tone(f, 0.22, "triangle", 0.1), i * 140)); },
  };

  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    audio.muted = !audio.muted;
    muteBtn.textContent = audio.muted ? "\ud83d\udd07" : "\ud83d\udd0a";
    if (!audio.muted) audio.ensure();
  });

  // ---------- Input ----------
  const input = {
    down: false,
    sx: 0, sy: 0,
    x: 0, y: 0,
    t0: 0,
    path: [],
  };

  function canvasToField(cx, cy) {
    const r = canvas.getBoundingClientRect();
    const px = (cx - r.left) * (canvas.width / r.width);
    const py = (cy - r.top) * (canvas.height / r.height);
    return {
      x: (px / dpr - view.x) / view.s,
      y: (py / dpr - view.y) / view.s,
    };
  }

  function onDown(e) {
    if (state.mode !== "playing") return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    const f = canvasToField(p.clientX, p.clientY);
    input.down = true;
    input.sx = f.x; input.sy = f.y;
    input.x = f.x; input.y = f.y;
    input.t0 = performance.now();
    input.path = [{ x: f.x, y: f.y }];
  }
  function onMove(e) {
    if (!input.down) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    const f = canvasToField(p.clientX, p.clientY);
    input.x = f.x; input.y = f.y;
    input.path.push({ x: f.x, y: f.y });
    if (input.path.length > 18) input.path.shift();
  }
  function onUp(e) {
    if (!input.down) return;
    if (e) e.preventDefault();
    input.down = false;
    if (state.mode !== "playing") return;
    const dt = Math.max(16, performance.now() - input.t0);
    const dx = input.x - input.sx;
    const dy = input.y - input.sy;
    const dist = Math.hypot(dx, dy);
    // Use last segment for flickier feel
    let fx = dx, fy = dy;
    if (input.path.length >= 3) {
      const a = input.path[input.path.length - 3];
      const b = input.path[input.path.length - 1];
      fx = b.x - a.x; fy = b.y - a.y;
    }
    const flick = Math.hypot(fx, fy);
    if (dist < 3.2 && flick < 1.6) {
      // tap: switch pressure target if opponent has ball
      tryTap(input.x, input.y);
      return;
    }
    doFlick(dx, dy, dist, dt, input.x, input.y);
    input.path = [];
  }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp, { passive: false });
  window.addEventListener("touchcancel", onUp, { passive: false });

  // ---------- Game flow ----------
  function resetBall(centerKick) {
    ball.x = FIELD_W / 2;
    ball.y = FIELD_H / 2 + (Math.random() - 0.5) * 0.2;
    ball.vx = 0; ball.vy = 0;
    ball.owner = null;
    ball.lastOwner = null;
    state.possession = null;
    state.trapLock = 0.25;
    if (centerKick) {
      // nibble toward kickoff team so someone can take it
    }
  }

  function placeKickoff() {
    const dir = state.kickoffTeam === BLUE ? 1 : -1;
    players.forEach((p) => {
      p.vx = 0; p.vy = 0; p.stunned = 0; p.kickCool = 0;
      if (p.role === "gk") {
        p.x = p.team === BLUE ? 8 : FIELD_W - 8;
        p.y = FIELD_H / 2;
      } else if (p.team === state.kickoffTeam) {
        if (p.role === "fwd") { p.x = FIELD_W / 2 - 6 * dir; p.y = FIELD_H / 2 + 3; }
        else { p.x = FIELD_W / 2 - 14 * dir; p.y = FIELD_H / 2 - 8; }
      } else {
        if (p.role === "fwd") { p.x = FIELD_W / 2 + 16 * dir; p.y = FIELD_H * 0.38; }
        else { p.x = FIELD_W / 2 + 22 * dir; p.y = FIELD_H * 0.62; }
      }
      p.homeX = p.x; p.homeY = p.y;
    });
    resetBall(true);
    const taker = players.find(p => p.team === state.kickoffTeam && p.role === "fwd")
      || players.find(p => p.team === state.kickoffTeam && p.role !== "gk");
    if (taker) {
      ball.owner = taker;
      ball.lastOwner = taker;
      state.possession = taker.team;
      ball.x = taker.x + (taker.team === BLUE ? 1.6 : -1.6);
      ball.y = taker.y;
    }
  }

  function startMatch(fromMenu) {
    state.score = [0, 0];
    state.kickoffTeam = BLUE;
    state.mode = "kickoff";
    state.kickoffT = 1.1;
    formation();
    placeKickoff();
    updateScore();
    overlay.classList.add("hidden");
    hintUntil = performance.now() + 8000;
    hintEl.classList.add("show");
    audio.whistle();
    showToast("Kickoff!");
  }

  function updateScore() {
    scoreEl.textContent = state.score[0] + " – " + state.score[1];
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.remove("show");
    void toastEl.offsetWidth;
    toastEl.classList.add("show");
  }

  function goalScored(team) {
    state.score[team] += 1;
    updateScore();
    scoreEl.classList.remove("pop");
    void scoreEl.offsetWidth;
    scoreEl.classList.add("pop");
    flashEl.classList.remove("go");
    void flashEl.offsetWidth;
    flashEl.classList.add("go");
    shake = 10;
    burst(ball.x, ball.y, team === BLUE ? "#2b6cff" : "#ff7a1a", 36);
    audio.goal();
    if (state.score[team] >= WIN_SCORE) {
      state.mode = "over";
      setTimeout(() => {
        audio.win();
        const winner = team === BLUE ? "Aarav wins!" : "CPU wins!";
        card.innerHTML = "<h1>" + winner + "</h1><p>" + state.score[0] + " – " + state.score[1] + "</p><button class='play' id='againBtn'>Play again</button>";
        overlay.classList.remove("hidden");
        document.getElementById("againBtn").addEventListener("click", () => startMatch(false));
      }, 900);
      showToast(team === BLUE ? "GOAL! Aarav!" : "GOAL!");
      return;
    }
    state.mode = "celebrate";
    state.celebrateT = 1.7;
    state.kickoffTeam = team === BLUE ? ORANGE : BLUE;
    showToast(team === BLUE ? "GOAL! Aarav!" : "GOAL!");
  }

  playBtn.addEventListener("click", () => {
    audio.ensure();
    startMatch(true);
  });

  // ---------- Helpers ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function teamPlayers(team) { return players.filter(p => p.team === team); }
  function oppTeam(t) { return t === BLUE ? ORANGE : BLUE; }
  function goalCenter(teamAttacking) {
    // Blue attacks right goal, orange attacks left
    return teamAttacking === BLUE
      ? { x: FIELD_W + 0.2, y: FIELD_H / 2 }
      : { x: -0.2, y: FIELD_H / 2 };
  }
  function ownGoalX(team) {
    return team === BLUE ? 0 : FIELD_W;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 4 + Math.random() * 16;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.5 + Math.random() * 0.5, max: 1,
        color, r: 0.25 + Math.random() * 0.35,
      });
    }
  }

  function kickDust(x, y) {
    burst(x, y, "rgba(255,255,255,0.8)", 8);
  }

  // ---------- Possession / flick ----------
  function holder() {
    return ball.owner;
  }

  function nearest(team, x, y, except) {
    let best = null, bestD = 1e9;
    for (const p of players) {
      if (p.team !== team) continue;
      if (except && p.id === except.id) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  function tryTrap() {
    if (state.trapLock > 0) return;
    if (ball.owner) return;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > 22) return;
    let best = null, bestD = 1e9;
    for (const p of players) {
      if (p.stunned > 0) continue;
      const reach = p.r + ball.r + (speed < 8 ? 1.15 : 0.55);
      const d = Math.hypot(p.x - ball.x, p.y - ball.y);
      if (d < reach && d < bestD) { bestD = d; best = p; }
    }
    if (best) {
      ball.owner = best;
      ball.lastOwner = best;
      ball.vx = 0; ball.vy = 0;
      state.possession = best.team;
      best.kickCool = 0.12;
    }
  }

  function releaseBall() {
    if (ball.owner) ball.lastOwner = ball.owner;
    ball.owner = null;
    state.trapLock = 0.28;
  }

  function aimTeammate(kicker, dirx, diry) {
    let best = null, bestScore = 0.42; // ~65° cone so kids connect passes
    for (const p of players) {
      if (p.team !== kicker.team || p.id === kicker.id) continue;
      const tx = p.x - kicker.x, ty = p.y - kicker.y;
      const td = Math.hypot(tx, ty) || 1;
      const nx = tx / td, ny = ty / td;
      const dot = nx * dirx + ny * diry;
      if (dot > bestScore && td < 42) {
        bestScore = dot;
        best = p;
      }
    }
    return best;
  }

  function shotOnGoal(team, dirx, diry, fromX, fromY) {
    const g = goalCenter(team);
    const tx = g.x - fromX, ty = g.y - fromY;
    const td = Math.hypot(tx, ty) || 1;
    const dot = (tx / td) * dirx + (ty / td) * diry;
    // also check if ray would hit goal mouth y-range
    const gx = team === BLUE ? FIELD_W : 0;
    if (Math.abs(dirx) < 0.15) return false;
    const t = (gx - fromX) / dirx;
    if (t < 0) return false;
    const iy = fromY + diry * t;
    const inMouth = iy > FIELD_H / 2 - GOAL_H / 2 - 3 && iy < FIELD_H / 2 + GOAL_H / 2 + 3;
    return dot > 0.42 && inMouth;
  }

  function doFlick(dx, dy, distPix, dt, endX, endY) {
    const len = Math.hypot(dx, dy) || 1;
    let dirx = dx / len, diry = dy / len;
    const power = clamp(distPix / 22, 0.18, 1);
    const speedBoost = clamp(140 / dt, 0.7, 1.6);
    const owner = ball.owner;

    if (owner && owner.team === BLUE) {
      kickFrom(owner, dirx, diry, power, speedBoost);
      return;
    }

    // Opponent has the ball or loose: swipe near ball to poke / tackle
    const nearBall = Math.hypot(endX - ball.x, endY - ball.y) < 10
      || Math.hypot(input.sx - ball.x, input.sy - ball.y) < 12;
    if (nearBall) {
      const chaser = nearest(BLUE, ball.x, ball.y);
      if (chaser) {
        const d = dist(chaser, ball);
        if (d < 7.5) {
          pokeBall(chaser, dirx, diry, power, speedBoost);
          return;
        }
      }
    }

    // If blue has a loose ball very close, treat as kick
    const closeBlue = nearest(BLUE, ball.x, ball.y);
    if (closeBlue && dist(closeBlue, ball) < 4.2 && !owner) {
      kickFrom(closeBlue, dirx, diry, power, speedBoost);
    }
  }

  function kickFrom(p, dirx, diry, power, speedBoost) {
    if (p.kickCool > 0) return;
    const passMate = aimTeammate(p, dirx, diry);
    const isShot = shotOnGoal(p.team, dirx, diry, p.x, p.y) && power > 0.38;
    let px = dirx, py = diry;
    let spd;

    if (passMate && !isShot && power < 0.82) {
      const tx = passMate.x - p.x, ty = passMate.y - p.y;
      const td = Math.hypot(tx, ty) || 1;
      // lead the teammate a little
      const lx = (passMate.x + passMate.vx * 0.25) - p.x;
      const ly = (passMate.y + passMate.vy * 0.25) - p.y;
      const ld = Math.hypot(lx, ly) || 1;
      px = lerp(dirx, lx / ld, 0.62);
      py = lerp(diry, ly / ld, 0.62);
      const n = Math.hypot(px, py) || 1;
      px /= n; py /= n;
      spd = clamp(18 + td * 0.55, 16, 34) * (0.75 + power * 0.4);
      audio.pass();
    } else {
      spd = (isShot ? 36 : 28) * (0.55 + power * 0.7) * speedBoost;
      spd = clamp(spd, 14, 48);
      audio.kick();
    }

    releaseBall();
    ball.x = p.x + px * (p.r + ball.r + 0.15);
    ball.y = p.y + py * (p.r + ball.r + 0.15);
    ball.vx = px * spd;
    ball.vy = py * spd;
    ball.lastOwner = p;
    state.lastTouch = p.team;
    p.kickCool = 0.28;
    kickDust(ball.x, ball.y);
    if (isShot) shake = Math.max(shake, 4);
  }

  function pokeBall(p, dirx, diry, power, speedBoost) {
    if (p.kickCool > 0) return;
    const d = dist(p, ball);
    if (d > 7.5) return;
    audio.tackle();
    if (ball.owner && ball.owner.team !== p.team) {
      ball.owner.stunned = 0.55;
    }
    releaseBall();
    state.trapLock = 0.4;
    const spd = 16 * (0.5 + power) * speedBoost;
    ball.vx = dirx * spd + (Math.random() - 0.5) * 3;
    ball.vy = diry * spd + (Math.random() - 0.5) * 3;
    ball.lastOwner = p;
    state.lastTouch = p.team;
    p.kickCool = 0.35;
    burst(ball.x, ball.y, "#fff", 10);
  }

  function tryTap(x, y) {
    // tap a blue player to make them the pressure target — they sprint to ball
    let best = null, bestD = 4.5;
    for (const p of players) {
      if (p.team !== BLUE) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestD) { bestD = d; best = p; }
    }
    if (best) best.pressed = 1.6;
  }

  // ---------- AI ----------
  function desiredFor(p) {
    const has = ball.owner;
    const myTeamHas = has && has.team === p.team;
    const loose = !has;
    const gAttack = goalCenter(p.team);
    const gDefend = { x: ownGoalX(p.team), y: FIELD_H / 2 };
    const ballSide = p.team === BLUE ? (ball.x > FIELD_W * 0.55) : (ball.x < FIELD_W * 0.45);

    if (p.role === "gk") {
      const boxX = p.team === BLUE ? 7.5 : FIELD_W - 7.5;
      let ty = clamp(ball.y, FIELD_H / 2 - GOAL_H * 0.42, FIELD_H / 2 + GOAL_H * 0.42);
      let tx = boxX;
      // come out on shots
      const towardOwn = p.team === BLUE ? ball.vx < -10 : ball.vx > 10;
      if (!myTeamHas && towardOwn && Math.abs(ball.y - FIELD_H / 2) < GOAL_H) {
        tx = p.team === BLUE ? clamp(ball.x - 2, 4, 16) : clamp(ball.x + 2, FIELD_W - 16, FIELD_W - 4);
        ty = lerp(ty, ball.y, 0.55);
      }
      return { x: tx, y: ty, sprint: towardOwn ? 1 : 0.7 };
    }

    if (has === p) {
      // dribble / decide to pass or shoot
      return { x: lerp(p.x, gAttack.x, 0.08), y: lerp(p.y, gAttack.y + Math.sin(p.id.charCodeAt(1)) * 6, 0.12), sprint: 0.85, onBall: true };
    }

    if (p.pressed > 0) {
      return { x: ball.x, y: ball.y, sprint: 1.15 };
    }

    if (myTeamHas) {
      // support: get open ahead and wide
      const holderP = has;
      const ahead = p.team === BLUE ? 14 : -14;
      const wide = (p.role === "fwd" ? 1 : -1) * (p.team === BLUE ? 12 : -12);
      let tx = clamp(holderP.x + ahead, 10, FIELD_W - 10);
      let ty = clamp(holderP.y + wide + Math.sin(performance.now() / 400 + p.num) * 3, 8, FIELD_H - 8);
      // stay offside-ish reasonable
      if (p.team === BLUE) tx = Math.min(tx, FIELD_W - 12);
      else tx = Math.max(tx, 12);
      return { x: tx, y: ty, sprint: 0.8 };
    }

    // defending / chase loose ball
    const mates = teamPlayers(p.team).filter(m => m.role !== "gk");
    const closest = mates.slice().sort((a, b) => dist(a, ball) - dist(b, ball))[0];
    if (p === closest || (loose && dist(p, ball) < 16)) {
      return { x: ball.x, y: ball.y, sprint: 1.05 };
    }
    // mark: stay between ball and own goal
    const mx = lerp(ball.x, gDefend.x, 0.35);
    const my = lerp(ball.y, gDefend.y, 0.2);
    return { x: clamp(mx, 8, FIELD_W - 8), y: clamp(my, 8, FIELD_H - 8), sprint: 0.85 };
  }

  function aiKickIfNeeded(p, dt) {
    if (ball.owner !== p) return;
    if (p.team === BLUE) return; // human flicks for blue
    if (p.kickCool > 0) return;
    p.aiThink = (p.aiThink || 0) + dt;
    const g = goalCenter(p.team);
    const toG = Math.hypot(g.x - p.x, g.y - p.y);
    const presser = nearest(oppTeam(p.team), p.x, p.y);
    const pressD = presser ? dist(presser, p) : 99;
    const dirG = { x: g.x - p.x, y: clamp(g.y - p.y, -8, 8) };
    const gl = Math.hypot(dirG.x, dirG.y) || 1;
    dirG.x /= gl; dirG.y /= gl;

    const shouldShoot = toG < 24 && Math.abs(p.y - FIELD_H / 2) < GOAL_H * 0.62 && p.aiThink > 0.55;
    const shouldPass = pressD < 4.6 && p.aiThink > 0.4;
    const shouldClear = p.role === "gk" && p.aiThink > 0.35;
    const dribbleTooLong = p.aiThink > 2.1;

    if (shouldShoot || shouldPass || shouldClear || dribbleTooLong) {
      let dx = dirG.x, dy = dirG.y;
      if (shouldPass && !shouldShoot) {
        const mate = aimTeammate(p, dirG.x, dirG.y) || teamPlayers(p.team).find(m => m.id !== p.id && m.role !== "gk");
        if (mate) {
          dx = mate.x - p.x; dy = mate.y - p.y;
          const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
        }
      }
      if (shouldClear) {
        dx = p.team === BLUE ? 0.85 : -0.85;
        dy = (Math.random() - 0.5) * 0.6;
        const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
      }
      const power = shouldShoot ? 0.86 : shouldClear ? 0.7 : 0.5;
      kickFrom(p, dx, dy, power, 1);
      p.aiThink = 0;
    }
  }

  function keeperSave(dt) {
    // If a fast ball is heading into the goal, snap keeper toward intercept
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed < 12 || ball.owner) return;
    for (const side of [BLUE, ORANGE]) {
      const gk = players.find(p => p.team === side && p.role === "gk");
      if (!gk) continue;
      const gx = side === BLUE ? 0 : FIELD_W;
      if (side === BLUE && ball.vx >= 0) continue;
      if (side === ORANGE && ball.vx <= 0) continue;
      const t = (gx - ball.x) / (ball.vx || 1e-6);
      if (t < 0 || t > 1.1) continue;
      const iy = ball.y + ball.vy * t;
      if (iy < FIELD_H / 2 - GOAL_H / 2 - 1 || iy > FIELD_H / 2 + GOAL_H / 2 + 1) continue;
      const ix = gx;
      const d = Math.hypot(gk.x - ix, gk.y - iy);
      if (d < (side === ORANGE ? 7.2 : 9.5)) {
        // dive toward intercept (orange keeper a bit less sticky)
        gk.x = lerp(gk.x, ix + (side === BLUE ? 1.2 : -1.2), side === ORANGE ? 0.12 : 0.18);
        gk.y = lerp(gk.y, clamp(iy, FIELD_H / 2 - GOAL_H / 2, FIELD_H / 2 + GOAL_H / 2), side === ORANGE ? 0.18 : 0.28);
        if (Math.hypot(gk.x - ball.x, gk.y - ball.y) < gk.r + ball.r + 0.9) {
          // block
          const nx = ball.x - gk.x, ny = ball.y - gk.y;
          const nl = Math.hypot(nx, ny) || 1;
          ball.owner = null;
          ball.vx = (nx / nl) * speed * 0.35 + (side === BLUE ? 8 : -8);
          ball.vy = (ny / nl) * speed * 0.25 + (Math.random() - 0.5) * 6;
          state.trapLock = 0.12;
          shake = Math.max(shake, 3);
          burst(ball.x, ball.y, "#fff", 12);
          audio.tackle();
        }
      }
    }
  }

  // ---------- Physics ----------
  function movePlayer(p, dt) {
    if (p.stunned > 0) p.stunned -= dt;
    if (p.kickCool > 0) p.kickCool -= dt;
    if (p.pressed > 0) p.pressed -= dt;

    const want = desiredFor(p);
    const dx = want.x - p.x, dy = want.y - p.y;
    const d = Math.hypot(dx, dy);
    const teamMul = p.team === ORANGE ? 0.88 : 1.04;
    const maxSpd = (p.role === "gk" ? 13 : 16.5) * (want.sprint || 1) * teamMul;
    if (d > 0.2) {
      const acc = 55;
      p.vx += (dx / d) * acc * dt;
      p.vy += (dy / d) * acc * dt;
    }
    const spd = Math.hypot(p.vx, p.vy);
    if (spd > maxSpd) {
      p.vx *= maxSpd / spd;
      p.vy *= maxSpd / spd;
    }
    p.vx *= 0.86;
    p.vy *= 0.86;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // hold ball slightly in front
    if (ball.owner === p) {
      const faceX = p.team === BLUE ? 1 : -1;
      const fx = p.vx !== 0 || p.vy !== 0 ? p.vx : faceX;
      const fy = p.vy;
      const fl = Math.hypot(fx, fy) || 1;
      ball.x = p.x + (fx / fl) * (p.r + 0.15);
      ball.y = p.y + (fy / fl) * (p.r * 0.15);
      ball.vx = p.vx; ball.vy = p.vy;
    }

    // bounds
    p.x = clamp(p.x, p.r + 0.4, FIELD_W - p.r - 0.4);
    p.y = clamp(p.y, p.r + 0.4, FIELD_H - p.r - 0.4);
    if (p.role === "gk") {
      if (p.team === BLUE) p.x = clamp(p.x, 3, 18);
      else p.x = clamp(p.x, FIELD_W - 18, FIELD_W - 3);
      p.y = clamp(p.y, FIELD_H / 2 - GOAL_H * 0.7, FIELD_H / 2 + GOAL_H * 0.7);
    }
  }

  function separatePlayers() {
    for (let i = 0; i < players.length; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i], b = players[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.001;
        const min = a.r + b.r - 0.1;
        if (d < min) {
          const push = (min - d) * 0.5;
          const nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
      }
    }
  }

  function bounceBallPlayers() {
    if (ball.owner) return;
    for (const p of players) {
      const dx = ball.x - p.x, dy = ball.y - p.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const min = ball.r + p.r;
      if (d < min) {
        const nx = dx / d, ny = dy / d;
        ball.x = p.x + nx * min;
        ball.y = p.y + ny * min;
        const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
        if (rel < 0) {
          ball.vx -= 1.55 * rel * nx;
          ball.vy -= 1.55 * rel * ny;
        }
        // slow ball a bit on body
        ball.vx *= 0.92; ball.vy *= 0.92;
        if (p.team !== (ball.lastOwner && ball.lastOwner.team) && Math.hypot(ball.vx, ball.vy) < 14) {
          // chance to control
          if (Math.random() < 0.45 && state.trapLock <= 0) {
            ball.owner = p;
            ball.lastOwner = p;
            ball.vx = 0; ball.vy = 0;
            state.possession = p.team;
            p.kickCool = 0.15;
          }
        }
      }
    }
  }

  function moveBall(dt) {
    if (state.trapLock > 0) state.trapLock -= dt;
    if (ball.owner) return;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    const damp = Math.exp(-2.4 * dt);
    ball.vx *= damp;
    ball.vy *= damp;
    const spdNow = Math.hypot(ball.vx, ball.vy);
    if (spdNow > 52) { ball.vx *= 52 / spdNow; ball.vy *= 52 / spdNow; }
    if (spdNow < 0.35) { ball.vx = 0; ball.vy = 0; }

    // sidelines / endlines, but allow goal mouths
    const gy0 = FIELD_H / 2 - GOAL_H / 2;
    const gy1 = FIELD_H / 2 + GOAL_H / 2;
    const inMouth = ball.y > gy0 + 0.05 && ball.y < gy1 - 0.05;

    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.72; }
    if (ball.y > FIELD_H - ball.r) { ball.y = FIELD_H - ball.r; ball.vy = -Math.abs(ball.vy) * 0.72; }

    // left end — open if in goal mouth
    if (ball.x < ball.r) {
      if (inMouth) {
        ball.y = clamp(ball.y, gy0 + ball.r, gy1 - ball.r);
      } else {
        ball.x = ball.r;
        ball.vx = Math.abs(ball.vx) * 0.7;
      }
    }
    // right end
    if (ball.x > FIELD_W - ball.r) {
      if (inMouth) {
        ball.y = clamp(ball.y, gy0 + ball.r, gy1 - ball.r);
      } else {
        ball.x = FIELD_W - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.7;
      }
    }

    // goal posts
    bouncePost(0, gy0);
    bouncePost(0, gy1);
    bouncePost(FIELD_W, gy0);
    bouncePost(FIELD_W, gy1);

    // keep ball inside the net, don't yank it back onto the pitch
    if (ball.x < -GOAL_W) { ball.x = -GOAL_W + ball.r; ball.vx *= 0.3; }
    if (ball.x > FIELD_W + GOAL_W) { ball.x = FIELD_W + GOAL_W - ball.r; ball.vx *= 0.3; }
  }

  function bouncePost(px, py) {
    const dx = ball.x - px, dy = ball.y - py;
    const d = Math.hypot(dx, dy);
    const pr = 0.55;
    if (d < ball.r + pr && d > 0) {
      const nx = dx / d, ny = dy / d;
      ball.x = px + nx * (ball.r + pr);
      ball.y = py + ny * (ball.r + pr);
      const rel = ball.vx * nx + ball.vy * ny;
      if (rel < 0) {
        ball.vx -= 1.8 * rel * nx;
        ball.vy -= 1.8 * rel * ny;
      }
    }
  }

  function checkGoal() {
    if (state.mode !== "playing") return;
    const gy0 = FIELD_H / 2 - GOAL_H / 2 + 0.15;
    const gy1 = FIELD_H / 2 + GOAL_H / 2 - 0.15;
    if (ball.y > gy0 && ball.y < gy1) {
      if (ball.x < 0) {
        goalScored(ORANGE);
        return;
      }
      if (ball.x > FIELD_W) {
        goalScored(BLUE);
        return;
      }
    }
    // if ball went past endline outside goal, throw-in-ish: keep in play bounce already handled
  }

  // ---------- View ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    const pad = Math.max(8, Math.min(w, h) * 0.03);
    const topHud = 58;
    const botHud = 28;
    const availW = w - pad * 2;
    const availH = h - pad * 2 - topHud * 0.35 - botHud * 0.25;
    const s = Math.min(availW / FIELD_W, availH / FIELD_H);
    view.s = s;
    view.x = (w - FIELD_W * s) / 2;
    view.y = Math.max(topHud * 0.55, (h - FIELD_H * s) / 2);
    view.pad = pad;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));

  function toX(x) { return view.x + x * view.s; }
  function toY(y) { return view.y + y * view.s; }

  // ---------- Draw ----------
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawField() {
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.fillStyle = "#1b6b2e";
    ctx.fillRect(0, 0, w, h);

    const fx = toX(0), fy = toY(0), fw = FIELD_W * view.s, fh = FIELD_H * view.s;

    // grass stripes
    const stripes = 10;
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = i % 2 === 0 ? "#34a34c" : "#2d9244";
      ctx.fillRect(fx + (fw / stripes) * i, fy, fw / stripes + 1, fh);
    }

    // pitch border fill already is stripes; now lines
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, fx, fy, fw, fh, 8);
    ctx.clip();

    ctx.strokeStyle = "rgba(255,255,255,0.92)";
    ctx.lineWidth = Math.max(2, view.s * 0.12);
    ctx.strokeRect(fx + 2, fy + 2, fw - 4, fh - 4);

    // halfway
    ctx.beginPath();
    ctx.moveTo(toX(FIELD_W / 2), fy);
    ctx.lineTo(toX(FIELD_W / 2), fy + fh);
    ctx.stroke();

    // center circle
    ctx.beginPath();
    ctx.arc(toX(FIELD_W / 2), toY(FIELD_H / 2), 9.15 * view.s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(toX(FIELD_W / 2), toY(FIELD_H / 2), 0.45 * view.s, 0, Math.PI * 2);
    ctx.fill();

    // boxes
    function box(x, w) {
      const bh = 40;
      const by = (FIELD_H - bh) / 2;
      ctx.strokeRect(toX(x), toY(by), w * view.s, bh * view.s);
      const sh = 18;
      const sy = (FIELD_H - sh) / 2;
      const sw = w > 0 ? 6 : -6;
      ctx.strokeRect(toX(x), toY(sy), sw * view.s, sh * view.s);
    }
    box(0, 16.5);
    box(FIELD_W, -16.5);

    // penalty spots
    ctx.beginPath();
    ctx.arc(toX(11), toY(FIELD_H / 2), 0.35 * view.s, 0, Math.PI * 2);
    ctx.arc(toX(FIELD_W - 11), toY(FIELD_H / 2), 0.35 * view.s, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // goals (outside pitch a bit)
    drawGoal(0, true);
    drawGoal(FIELD_W, false);

    // stands / rim
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 6;
    roundRect(ctx, fx - 6, fy - 6, fw + 12, fh + 12, 12);
    ctx.stroke();
  }

  function drawGoal(x, left) {
    const gy0 = FIELD_H / 2 - GOAL_H / 2;
    const netW = GOAL_W * view.s;
    const x0 = left ? toX(x) - netW : toX(x);
    const y0 = toY(gy0);
    const h = GOAL_H * view.s;

    ctx.fillStyle = left ? "rgba(43,108,255,0.22)" : "rgba(255,122,26,0.22)";
    ctx.fillRect(x0, y0, netW, h);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = Math.max(3, view.s * 0.2);
    ctx.strokeRect(x0, y0, netW, h);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1;
    const steps = 5;
    for (let i = 1; i < steps; i++) {
      ctx.beginPath();
      ctx.moveTo(x0 + (netW / steps) * i, y0);
      ctx.lineTo(x0 + (netW / steps) * i, y0 + h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x0, y0 + (h / steps) * i);
      ctx.lineTo(x0 + netW, y0 + (h / steps) * i);
      ctx.stroke();
    }
    // posts
    ctx.fillStyle = "#f4f4f4";
    ctx.fillRect(toX(x) - 2, y0 - 3, 4, h + 6);
  }

  function drawPlayer(p) {
    const x = toX(p.x), y = toY(p.y);
    const r = p.r * view.s;
    const blue = p.team === BLUE;
    const body = blue ? "#2b6cff" : "#ff7a1a";
    const dark = blue ? "#163e9c" : "#c45300";
    const accent = blue ? "#8cbcff" : "#ffd0a3";

    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.85, r * 0.85, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    // highlight ring if has ball or is Aarav
    if (ball.owner === p) {
      ctx.strokeStyle = "#ffe56a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.team === BLUE && !ball.owner && dist(p, ball) < 8) {
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r + 4, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.team === BLUE && ball.owner && ball.owner.team === ORANGE && p === nearest(BLUE, ball.x, ball.y)) {
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (p.name === "Aarav") {
      ctx.strokeStyle = "rgba(255,229,106,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r + 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    // body
    const grd = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.2, x, y, r);
    grd.addColorStop(0, accent);
    grd.addColorStop(0.45, body);
    grd.addColorStop(1, dark);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // number
    ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.max(10, r * 0.95) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(p.num), x, y + 0.5);

    // name for Aarav
    if (p.name === "Aarav") {
      ctx.font = "800 " + Math.max(10, r * 0.55) + "px system-ui, sans-serif";
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 3;
      ctx.strokeText("Aarav", x, y - r - 8);
      ctx.fillText("Aarav", x, y - r - 8);
    }
  }

  function drawBall() {
    const x = toX(ball.x), y = toY(ball.y);
    const r = ball.r * view.s * 1.15;

    // motion trail
    const spd = Math.hypot(ball.vx, ball.vy);
    if (spd > 10 && !ball.owner) {
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.beginPath();
      ctx.arc(x - ball.vx * view.s * 0.03, y - ball.vy * view.s * 0.03, r * 0.75, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.7, r * 0.75, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // simple pentagon-ish patches
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5 + ball.x * 0.4;
      const px = x + Math.cos(a) * r * 0.38;
      const py = y + Math.sin(a) * r * 0.38;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawAim() {
    if (!input.down || state.mode !== "playing") return;
    const owner = ball.owner;
    const canKick = (owner && owner.team === BLUE) || (!owner && nearest(BLUE, ball.x, ball.y) && dist(nearest(BLUE, ball.x, ball.y), ball) < 5);
    const tackle = !canKick;
    ctx.save();
    ctx.strokeStyle = tackle ? "rgba(255,255,255,0.55)" : "rgba(255,229,106,0.9)";
    ctx.fillStyle = tackle ? "rgba(255,255,255,0.2)" : "rgba(255,229,106,0.25)";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(toX(input.sx), toY(input.sy));
    ctx.lineTo(toX(input.x), toY(input.y));
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(toX(input.x), toY(input.y), 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life / (p.max || 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(toX(p.x), toY(p.y), p.r * view.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawNamesUnder() {
    // nothing extra
  }

  // ---------- Loop ----------
  function tick(t) {
    const dt = Math.min(0.033, (t - lastT) / 1000 || 0.016);
    lastT = t;

    if (hintUntil && performance.now() > hintUntil) {
      hintEl.classList.remove("show");
      hintUntil = 0;
    }

    if (state.mode === "kickoff") {
      state.kickoffT -= dt;
      if (state.kickoffT <= 0) {
        state.mode = "playing";
        showToast("GO!");
      }
    }
    if (state.mode === "celebrate") {
      state.celebrateT -= dt;
      if (state.celebrateT <= 0) {
        placeKickoff();
        state.mode = "kickoff";
        state.kickoffT = 0.9;
        audio.whistle();
        showToast("GO!");
      }
    }

    if (state.mode === "playing" || state.mode === "kickoff") {
      if (state.mode === "playing") {
        for (const p of players) {
          movePlayer(p, dt);
          aiKickIfNeeded(p, dt);
        }
        separatePlayers();
        moveBall(dt);
        bounceBallPlayers();
        tryTrap();
        keeperSave(dt);
        checkGoal();

        // anti-stuck: if ball is frozen with no owner for too long, nudge nearest
        if (!ball.owner && Math.hypot(ball.vx, ball.vy) < 0.2) {
          ball.stuck = (ball.stuck || 0) + dt;
          if (ball.stuck > 2.8) {
            const n = nearest(state.lastTouch ?? BLUE, ball.x, ball.y);
            if (n) { ball.owner = n; ball.stuck = 0; }
          }
        } else ball.stuck = 0;
      } else {
        // kickoff freeze: still breathe a little
        for (const p of players) {
          p.x += Math.sin(t / 220 + p.num) * 0.002;
        }
      }
    }

    if (state.mode === "celebrate") {
      moveBall(dt * 0.4);
      for (const p of players) {
        p.x += Math.sin(t / 80 + p.num) * 0.02;
      }
    }

    shake *= 0.88;
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;

    ctx.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);
    drawField();
    // draw players back-to-front by y
    const order = players.slice().sort((a, b) => a.y - b.y);
    for (const p of order) drawPlayer(p);
    drawBall();
    drawAim();
    drawParticles(dt);

    requestAnimationFrame(tick);
  }

  formation();
  resize();
  requestAnimationFrame(tick);
  if (/\bautostart\b/.test(location.search)) {
    setTimeout(() => { if (state.mode === "menu") startMatch(true); }, 80);
  }
  if (/\btestgoal\b/.test(location.search)) {
    setTimeout(() => {
      if (state.mode === "menu") startMatch(true);
      setTimeout(() => {
        ball.owner = null;
        ball.x = FIELD_W + 0.8;
        ball.y = FIELD_H / 2;
        ball.vx = 8; ball.vy = 0;
        state.mode = "playing";
        checkGoal();
      }, 700);
    }, 80);
  }

  // Prevent pull-to-refresh / scroll
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
})();
</script>
</body>
</html>
